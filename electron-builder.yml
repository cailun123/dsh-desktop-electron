# dsh-desktop-electron packaging. The app payload is lib/ (the Electron main
# and local primitives), build/ (icons), and the production dependency closure
# rooted at cross-spawn. The shell carries no harness source or Node runtime;
# the backend remains the host's own `dsh web`.
appId: ai.deepseek.dsh-desktop-electron
productName: DSH Desktop
directories:
  output: release
  buildResources: build
files:
  - lib/**
  - build/**
  - package.json
asar: true
# The only native module in this workspace is @resvg/resvg-js, which lives in
# devDependencies and is only used by `scripts/generate-icons.mjs` to rasterize
# SVG assets at developer time. It is never bundled into the packaged app
# (the `files:` list above is a closed set and contains no node_modules from
# devDependencies). Running electron-builder's npm-rebuild helper therefore
# just spawns node-gyp against a module that is not part of the production
# payload. On hosts where child-process spawning is restricted (e.g. locked-
# down Windows sessions, certain CI sandboxes), the @electron/rebuild helper
# fork fails with EPERM and aborts the whole package. Disabling npmRebuild is
# the documented, safe escape hatch in that case.
npmRebuild: false
# The reaper runs under Electron-as-Node, which cannot read inside app.asar.
asarUnpack:
  - lib/reaper.js
  - lib/process-tree.js
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - tar.gz
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DSH Desktop
portable:
  artifactName: ${productName}-${version}-portable.${ext}
